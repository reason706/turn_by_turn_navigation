<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beautiful turn-by-turn navigation system using MapLibre GL JS and Valhalla routing" />
    <title>Turn-by-Turn Navigation System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #f3f4f6;
      }

      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="route-input-panel"></div>
      <div id="search-container"></div>
      <div id="control-panel"></div>
      <div id="nav-panel"></div>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
