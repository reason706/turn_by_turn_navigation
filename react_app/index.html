<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenNav React App</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #e5e7eb; }
      .app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
      .panel { background: #fff; border-right: 1px solid #d1d5db; display: flex; flex-direction: column; min-width: 0; }
      .header { background: #1d4ed8; color: white; padding: 14px; }
      .header h1 { margin: 0 0 10px; font-size: 20px; }
      .controls { padding: 12px; overflow: auto; }
      .row { margin-bottom: 8px; position: relative; }
      input, select, button { width: 100%; border-radius: 10px; border: 1px solid #cbd5e1; padding: 10px; }
      button { border: none; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
      button.secondary { background: #475569; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
      .resultList { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
      .result { width: 100%; text-align: left; background: #fff; color: #111827; border-radius: 0; border: 0; border-bottom: 1px solid #f3f4f6; }
      .result:last-child { border-bottom: 0; }
      .status { font-size: 13px; background: #eff6ff; border: 1px solid #dbeafe; padding: 8px; border-radius: 10px; margin-bottom: 8px; }
      .error { font-size: 13px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 8px; border-radius: 10px; margin-bottom: 8px; }
      .summary { font-weight: 700; margin-bottom: 8px; }
      .stepCard { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; display: grid; gap: 5px; }
      .mapWrap { position: relative; }
      #map { width: 100%; height: 100%; }
      .eta { position: absolute; left: 14px; right: 14px; bottom: 14px; background: rgba(15,23,42,.9); color: #fff; border-radius: 12px; padding: 10px 12px; z-index: 10; }
      .etaMain { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
      .progress { position: absolute; left: 14px; right: 14px; bottom: 2px; height: 6px; border-radius: 999px; background: rgba(0,0,0,.2); z-index: 11; }
      .progressFill { height: 100%; border-radius: 999px; background: #22c55e; transition: width .15s linear; }
      @media (max-width: 980px) { .app { grid-template-columns: 1fr; grid-template-rows: 54vh 46vh; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script type="text/babel" data-presets="env,react" src="./app.jsx"></script>
  </body>
</html>
