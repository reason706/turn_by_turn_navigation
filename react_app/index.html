<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenNav React</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .layout { display: grid; grid-template-columns: 390px 1fr; height: 100vh; }
      .panel { padding: 14px; border-right: 1px solid #e5e7eb; overflow: auto; background: #fff; }
      .panel h1 { margin: 0 0 8px; font-size: 20px; }
      .muted { color: #4b5563; font-size: 13px; margin-bottom: 10px; }
      label { display: block; font-size: 12px; color: #374151; margin: 8px 0 4px; font-weight: 600; }
      input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
      .buttons { display: grid; gap: 8px; grid-template-columns: 1fr 1fr 1fr; margin: 10px 0; }
      button { border: none; border-radius: 8px; padding: 10px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; }
      button.secondary { background: #475569; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { background: #eff6ff; border: 1px solid #dbeafe; padding: 8px; border-radius: 8px; font-size: 13px; }
      .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 8px; border-radius: 8px; font-size: 13px; }
      .summary { font-weight: 700; color: #0f172a; }
      .step-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; display: grid; gap: 5px; }
      .step-card small { color: #475569; }

      .map-wrap { width: 100%; height: 100%; position: relative; }
      .map-wrap .maplibregl-map { width: 100%; height: 100%; }

      .eta-panel {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 12;
        background: rgba(15, 23, 42, 0.9);
        color: white;
        border-radius: 12px;
        padding: 10px 14px;
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
      }
      .eta-title { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
      .eta-main { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 14px; }

      .progress-track { position: absolute; left: 16px; right: 16px; bottom: 4px; height: 6px; border-radius: 999px; background: rgba(15,23,42,0.25); z-index: 13; }
      .progress-fill { height: 100%; background: #22c55e; border-radius: 999px; transition: width 180ms linear; }

      @media (max-width: 960px) {
        .layout { grid-template-columns: 1fr; grid-template-rows: 52vh 48vh; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
